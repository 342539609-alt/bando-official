<style>
  :root {
    --primary: #1a3a8f;
    --primary-light: #2952c4;
    --accent: #b8902a;
    --accent-light: #d4a93a;
    --bg-dark: #04091a;
    --bg-card: #080f26;
    --bg-card2: #0d1835;
    --text-light: #e8edf8;
    --text-muted: #8fa3c8;
    --glow: rgba(41,82,196,0.6);
    --glow2: rgba(184,144,42,0.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg-dark);
    color: var(--text-light);
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
  }

  /* Nav */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(4,9,26,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(41,82,196,0.15);
    padding: 16px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .nav-logo img {
    height: 36px;
  }
  .nav-logo span {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: 1px;
  }
  .nav-back {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
    transition: color 0.3s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav-back:hover { color: var(--accent-light); }

  /* Hero */
  .page-hero {
    padding: 80px 48px 60px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .page-hero::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(41,82,196,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .page-hero .tag {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--accent-light);
    text-transform: uppercase;
    margin-bottom: 16px;
    position: relative;
  }
  .page-hero h1 {
    font-size: clamp(28px, 4vw, 46px);
    font-weight: 700;
    margin-bottom: 12px;
    position: relative;
  }
  .page-hero h1 .gradient-text {
    background: linear-gradient(135deg, #4a8fff 30%, var(--accent-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .page-hero .sub {
    color: var(--text-muted);
    font-size: 15px;
    letter-spacing: 2px;
    position: relative;
  }
  .hero-divider {
    width: 1px; height: 60px;
    background: linear-gradient(to bottom, transparent, var(--primary-light), transparent);
    margin: 40px auto 0;
  }

  /* Grid */
  .franchise-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 48px 120px;
  }
  .franchise-card {
    background: var(--bg-card);
    border: 1px solid rgba(41,82,196,0.15);
    border-radius: 12px;
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
    position: relative;
    overflow: hidden;
    min-height: 200px;
  }
  .franchise-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary-light), var(--accent-light));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s;
  }
  .franchise-card:hover::before { transform: scaleX(1); }
  .franchise-card:hover {
    border-color: rgba(41,82,196,0.4);
    transform: translateY(-6px);
    box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 32px rgba(41,82,196,0.08);
  }
  .franchise-num {
    font-size: 48px;
    font-weight: 900;
    background: linear-gradient(135deg, rgba(41,82,196,0.2), rgba(184,144,42,0.12));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 12px;
  }
  .franchise-card h3 {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.5;
    color: var(--text-light);
    flex: 1;
  }
  .franchise-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--accent-light);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    letter-spacing: 1px;
    transition: gap 0.3s, color 0.3s;
    margin-top: auto;
    padding-top: 12px;
  }
  .franchise-link:hover { gap: 14px; color: #e0b840; }
  .franchise-link::after {
    content: '→';
    font-size: 16px;
    transition: transform 0.3s;
  }
  .franchise-link:hover::after { transform: translateX(3px); }

  /* Reveal */
  .reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Footer */
  footer {
    border-top: 1px solid rgba(41,82,196,0.15);
    padding: 32px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }
  footer a {
    color: var(--accent-light);
    text-decoration: none;
    transition: color 0.3s;
  }
  footer a:hover { color: #e0b840; }

  @media(max-width:768px) {
    header { padding: 14px 20px; }
    .page-hero { padding: 60px 20px 40px; }
    .franchise-grid { grid-template-columns: 1fr; gap: 16px; padding: 0 20px 80px; }
    .franchise-card { padding: 28px 22px; }
    .franchise-num { font-size: 42px; }
    .franchise-card h3 { font-size: 17px; }
    .franchise-card p { font-size: 13px; }
    footer { flex-direction: column; gap: 8px; text-align: center; padding: 24px 20px; }
  }
</style>
</head>

<script>
(function() {
  const observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(function(el) { observer.observe(el); });
})();
